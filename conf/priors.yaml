# ==============================================================================
# MCM 2026 Problem C: Bayesian Prior Definitions & Sampling Hyperparameters
# Role: Defining the "Mental Model" of Fan Behavior (The Superstar Effect)
# Standard: Industrial Bayesian Inference / Peer-Reviewed Research Ready
# ==============================================================================

metadata:
  framework: "Bayesian Inverse Optimization (BIO)"
  author: "Quantitative Inference Engine v4.1"
  description: "Priors for Latent Fan Vote Shares based on Preferential Attachment"

# ------------------------------------------------------------------------------
# 1. Latent Distribution Models (潜变量分布模型)
# 物理意义：模拟社交媒体的马太效应，即“流量向头部倾斜”的分布特征。
# ------------------------------------------------------------------------------
vote_distribution:
  primary_model: "Zipf_Power_Law"  # 模拟顶流现象
  fallback_model: "Log_Normal"     # 模拟常规热度分布

  zipf_params:
    alpha: 1.2                     # 标准幂律指数：决定了贫富差距的斜率
    min_vote_share: 0.005          # 兜底得票率：防止长尾端出现数学奇异值

  log_normal_params:
    mu_base: 0.0
    sigma_base: 0.6                # 决定了“黑马”突破先验屏障的概率
    clip_threshold: [0.001, 0.9]

# ------------------------------------------------------------------------------
# 2. Season-Specific Priors (针对 Task 1 & 2 的专项配置)
# [关键修复]: 补全了 inference 块，解决 priors.py 中的 KeyError
# ------------------------------------------------------------------------------
inference:
  priors:
    # 物理意义：全明星赛季(S15)选手实力极度接近，人气分布更趋向扁平化（Entropy更高）
    alpha_allstar: 0.8             # 显著低于标准 1.2，代表竞争的白热化

# ------------------------------------------------------------------------------
# 3. Informative Prior Weights (启发式因子权重)
# 逻辑：在观测数据进入前，我们对明星热度的初始“猜测”权重。
# ------------------------------------------------------------------------------
factor_anchors:
  partner_alpha_weight: 0.45       # 舞伴的“带粉能力”权重
  technical_momentum_weight: 0.25  # 选手的“成长剧本”权重
  industry_base_bias:              # 行业初始流量池 (Prior Mean Shift)
    "Sports": 0.05
    "Music": 0.08
    "Screen": 0.03
    "Media": 0.12                  # 电视真人秀明星具有天然的民意优势
    "Other": 0.0

# ------------------------------------------------------------------------------
# 4. Regularization & Penalty (似然函数正则项)
# 物理意义：防止 MCMC 为了满足硬约束而产生不符合社会学逻辑的极端解。
# ------------------------------------------------------------------------------
regularization:
  entropy_weight: 0.01             # 最大熵正则：倾向于平滑分布（奥卡姆剃刀）
  l2_shrinkage: 0.05               # 抑制离群点选票
  consistency_penalty: 0.15        # 时间相干性约束：选票不应在周际无故跳变

# ------------------------------------------------------------------------------
# 5. Solver & Sampling Strategy (执行层参数)
# 注意：n_chains 应在 rules.yaml 中与硬件核心数对齐，此处为单链默认配置。
# ------------------------------------------------------------------------------
optimization_control:
  method: "SLSQP"
  fallback: "COBYLA"
  max_iter: 1500
  tolerance: 1e-7

  sampling:
    n_chains: 23                   # [同步更新]: 严格对齐你 23 核 CPU
    n_samples: 100000              # 每条链的厚度
    burn_in_pct: 0.2
    thinning: 10                   # 稀疏采样：降低马尔可夫链自相关性
    jump_size: 0.05                # 决定了采样器在能量景观上的勘探步长

# ------------------------------------------------------------------------------
# 6. Convergence Metrics (学术准入判据)
# ------------------------------------------------------------------------------
diagnostics:
  r_hat_threshold: 1.1             # 顶刊级标准：R-hat < 1.1 视为全局收敛
  ess_min: 1000                    # 有效样本当量底线
  fidelity_score_min: 0.95         # 业务逻辑解释力底线