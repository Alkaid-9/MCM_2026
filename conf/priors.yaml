# ==============================================================================
# MCM 2026 Problem C: Statistical Shape & Prior Definitions
# Role: Defining the "Mental Model" of Fan Behavior (The Superstar Effect)
# Function: Providing distributional hyperparameters for the Bayesian Prior Engine.
# Version: 4.5.0-Bayesian-Final
# ==============================================================================

metadata:
  framework: "Bayesian Inverse Optimization (BIO)"
  author: "Quantitative Inference Engine v4.5"
  description: "Hyperparameters for Zipfian and Dirichlet Manifolds."

# ------------------------------------------------------------------------------
# 1. 核心分布形态 (Latent Distribution Models)
# 物理意义：模拟社交媒体的马太效应 (Matthew Effect)，即“流量向头部倾斜”。
# ------------------------------------------------------------------------------
vote_distribution:
  primary_model: "Zipf_Power_Law"  # 主模型：幂律分布

  # [Zipf's Law] P(r) ~ 1 / r^alpha
  zipf_params:
    # 标准衰减指数：1.2 是典型的社交网络关注度分布参数
    # Sensitivity Check: 尝试 [0.8, 1.5]
    alpha_standard: 1.2

    # 全明星赛季 (S15) 的修正：流量更扁平，贫富差距小
    alpha_allstar: 0.8

    # 截断保护：防止长尾端出现数学上的无穷小，导致 Log-Likelihood 爆炸
    min_vote_share: 0.001  # 0.1% 的兜底票仓

  # [备用模型] Log-Normal (用于 Task 7 的鲁棒性对比)
  # 假设观众投票服从对数正态分布而非幂律分布，看结果是否显著变化
  log_normal_params:
    mu_base: 0.0
    sigma_base: 0.6  # 波动率：决定了“黑马”突破先验屏障的概率

# ------------------------------------------------------------------------------
# 2. Dirichlet 先验场参数 (The Bayesian Anchor)
# 物理意义：控制先验分布在单纯形 (Simplex) 上的集中程度。
# ------------------------------------------------------------------------------
dirichlet_field:
  # 基础浓度 (Concentration Base)
  # alpha_vector = 1 + strength * prior_mean
  # 这个参数必须与 rules.yaml 中的 inference.constraints.prior_strength 协同调整
  # 建议保持默认，在 rules.yaml 中进行全局调控
  concentration_scaling: "Linear"

# ------------------------------------------------------------------------------
# 3. 赛季特异性覆盖 (Season-Specific Overrides)
# 学术价值：体现对特定历史背景的精细化建模
# ------------------------------------------------------------------------------
season_overrides:
  # Season 15: All-Stars
  15:
    distribution_model: "Zipf_Power_Law"
    alpha: 0.8  # 竞争白热化

  # Season 27: The Bobby Bones Anomaly
  # 即使我们知道他赢了，先验依然假设他是长尾分布。
  # 这样 Posterior 与 Prior 的巨大差异（KL 散度）才能证明“他赢全靠死忠粉”。
  27:
    distribution_model: "Zipf_Power_Law"
    alpha: 1.2  # 保持标准，让数据去“打脸”先验

# ------------------------------------------------------------------------------
# 4. 灵敏度分析配置 (Task 7: Sensitivity Analysis)
# 目标：生成论文 Robustness Check 章节的素材
# ------------------------------------------------------------------------------
sensitivity_analysis:
  # 场景 A: 弱先验 (Weak Prior)
  # 假设：观众完全随波逐流，没有固有偏好
  scenario_weak:
    prior_strength: 10.0
    zipf_alpha: 0.5

  # 场景 B: 强先验 (Strong Prior)
  # 假设：观众也是“外貌协会”或“唯名气论”，无视舞蹈质量
  scenario_strong:
    prior_strength: 200.0
    zipf_alpha: 1.5

# ------------------------------------------------------------------------------
# 5. 异常检测阈值 (Anomaly Detection Thresholds)
# ------------------------------------------------------------------------------
thresholds:
  # 熵值熔断线：如果 entropy > 0.95 * max_entropy，说明模型完全甚至不知道谁会赢
  max_entropy_ratio: 0.95

  # 排名置信度阈值：如果 95% CI 的区间宽度超过 5 个排名身位，视为“不可知”
  rank_uncertainty_span: 5